[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tahuti"
version = "0.5.0"
description = "ManageBac toolkit for students: typed Python SDK, CLI, MCP server & event engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Allen" }]
keywords = ["managebac", "managebac.com", "managebac.cn", "tahuti", "lms", "grades", "tasks", "crawler", "scraper", "mcp", "webhook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    # The IANA timezone database, unconditionally. CPython's `zoneinfo` is only
    # a reader — it needs the database from somewhere, and it is missing from
    # plenty of hosts that run Python: macOS, Windows, and the slim Linux
    # containers that CI and Docker images use (this repo's own GitHub runner
    # is one — see test_naive_due_date_is_read_on_the_configured_school_clock,
    # which failed on every Python version until this was added). It is not
    # platform-conditional because the hosts that lack it are not predictable
    # from sys_platform, and the failure is silent: ZoneInfo raises,
    # resolve_school_timezone swallows it, and the scheduler falls back to the
    # host clock — the ~16-hour-late-reminder bug it exists to prevent.
    "tzdata>=2023.3",
]

# Upper bound is required: mcp 2.x renamed FastMCP to MCPServer and removed
# mcp.server.fastmcp, which mcp_server.py imports. Without <2 a fresh resolve
# installs mcp 2.x and every `tahuti-mcp` invocation dies on import.
[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]

# Development-only dependencies. Deliberately *not* optional-dependency
# extras: nothing here belongs in a published runtime environment.
# - requests-mock is imported by tests but was previously undeclared, so a
#   plain `uv sync` could never run the suite.
# - mcp is the [mcp] extra; pulled in here because tests/test_mcp_server.py
#   imports it unconditionally.
[dependency-groups]
dev = [
    "pytest>=8",
    "requests-mock>=1.12",
    "mcp>=1.20,<2",
]

[project.scripts]
tahuti = "tahuti.__main__:main"
tahuti-mcp = "tahuti.mcp_server:main"
mb = "tahuti.__main__:main"        # alias (pre-rename command, still supported)
mb-mcp = "tahuti.mcp_server:main"  # alias

[project.urls]
Homepage = "https://github.com/allen546/tahuti"
Repository = "https://github.com/allen546/tahuti"
Issues = "https://github.com/allen546/tahuti/issues"
Changelog = "https://github.com/allen546/tahuti/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

# ── Packaging ────────────────────────────────────────────────────────────
# Hatchling's sdist default is "everything git does not ignore", which once
# shipped a 75 MB nested worktree clone from .claude/worktrees/ (76 of the
# 152 sdist entries). The include list below pins exactly what ships so this
# cannot regress; the excludes are belt-and-braces on top of .gitignore.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/extras",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/pyproject.toml",
]
exclude = [
    # Agent/tooling scratch space — .claude/worktrees/ holds full repo clones.
    "/.claude",
    "/.worktrees",
    # Build and environment noise.
    "/dist",
    "/build",
    "/.venv",
    "*.egg-info",
    # Internal design/planning artifacts; kept in the repo but not shipped.
    "/docs/superpowers",
    "/docs/deployments",
    # Never ship bytecode.
    "**/__pycache__",
    "*.pyc",
    "*.pyo",
]

[tool.hatch.build.targets.wheel]
packages = ["/src/tahuti"]
